{% extends 'base.html' %}
{% block title %}New Post{% endblock %}
{% block content %}
  <h1>Create New Post</h1>

  {% if messages %}
    <ul>
      {% for message in messages %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>

  <p><a href="{% url 'post_list' %}">Back to Posts</a></p>
{% endblock %}
