{% extends "base.html" %}
{% block content %}
  <h1>Confirm delete</h1>
  <p>Are you sure you want to delete "<strong>{{ post.title }}</strong>"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'post_detail' pk=post.pk %}">Cancel</a>
  </form>
{% endblock %}
